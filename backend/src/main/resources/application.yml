spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qrfood}
    username: ${DATABASE_USERNAME:qrfood}
    password: ${DATABASE_PASSWORD:qrfood}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:qrfood-super-secret-key-change-me}
    expiration-ms: ${JWT_EXPIRATION:86400000}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.security: INFO
